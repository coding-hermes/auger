; The repo had no pytest configuration. This is the smallest form that works: it sets the
; rootdir to the repo root (so `python3 -m pytest` with no arguments finds the suite) and
; registers the one custom marker, so a marked run cannot be mistaken for a typo.
[pytest]
testpaths = tests
markers =
    jev: exercises the external JEV decisions model (OpenRouter), which can be unreachable
