# Packaging metadata for Auger (QA-AUGER-11): releases were previously raw GitHub
# tags with no pip-installable metadata. auger.py is deliberately stdlib-only
# (docs/DESIGN.md v0.1 decision), so dependencies stay empty. The single module
# is declared via py-modules (not a package dir). Version lives in auger.py as
# AUGER_VERSION and is resolved by setuptools' attr directive (AST read, no
# import needed at build time).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auger"
description = "Spec drilling for projects, backed by DuckBrain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.scripts]
auger = "auger:main"

[tool.setuptools]
py-modules = ["auger"]

[tool.setuptools.dynamic]
version = { attr = "auger.AUGER_VERSION" }
