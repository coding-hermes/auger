# Packaging metadata for Auger (QA-AUGER-11): releases were previously raw GitHub
# tags with no pip-installable metadata. auger.py is deliberately stdlib-only
# (docs/DESIGN.md v0.1 decision), so runtime dependencies stay empty. The single
# module is declared via py-modules (not a package dir). Version lives in auger.py as
# AUGER_VERSION and is resolved by setuptools' attr directive (AST read, no
# import needed at build time).
#
# `dev` (QA-AUGER-12-R2): the TEST dependency extra, so the documented dev
# install `pip install -e '.[dev]'` actually installs pytest + PyYAML —
# tests/test_openapi_parity.py imports yaml at collection time. Runtime
# `pip install auger` pulls nothing beyond auger itself.
#
# `dev` also carries `lxml` (AUG-125/AUG-133, owner decision D-1): the published
# grammar `specs/schema/auger-spec-1.0.xsd` is loaded by a REAL XSD 1.0 processor,
# and `auger spec validate|check|list|assemble|bundle` refuse with a typed
# `xsd-processor-missing` error when none is installed. That refusal is the whole
# reason the dependency lives in an extra instead of `dependencies`: the wheel stays
# stdlib-only, and a host without the processor gets NO verdict rather than a green
# one it did not earn. `[project.optional-dependencies].xsd` is the same package for
# a user who wants schema-aware validation without the test tooling.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auger"
description = "Spec drilling for projects, backed by DuckBrain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml", "lxml>=5"]
xsd = ["lxml>=5"]

[project.scripts]
auger = "auger:main"

[tool.setuptools]
py-modules = ["auger"]

[tool.setuptools.dynamic]
version = { attr = "auger.AUGER_VERSION" }
