  /api/ns/{namespace}/recall:
    get:
      operationId: recallNamespace
      summary: Semantic search over the namespace's memory
      description: 'The `recall` verb as data: ranked hits from the namespace''s embedded memory, each
        labelled with the retrieval tier the substrate answered on (semantic vs lexical — the two scales
        are not comparable, so the tier travels with the scores). Read-only for auger''s rows; it queries
