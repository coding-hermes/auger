              schema: *id001
        '502':
          description: The DuckBrain substrate refused a read.
          content:
            application/json:
              schema: *id001
      x-cli: auger -n <namespace> export
  /api/ns/{namespace}/check:
    post:
      operationId: checkNamespaceEvidence
      summary: Is this question already answered by stored evidence?
      description: 'The `check` verb: retrieve the nearest stored evidence for a question, then ask JEV
        (the external decisions model) whether the evidence already answers it. READ-ONLY with respect
        to auger''s records, but it makes an EXTERNAL model call and can incur cost — disclosed here by
