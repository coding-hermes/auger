components:
  schemas:
    HealthStatus:
      type: object
      description: The substrate's advisory embedding status. Any field except `tier` can be null when
        the substrate did not answer.
      required:
      - tier
      - embedding_healthy
      - provider
      - model
      properties:
        tier:
          type: string
          enum:
          - semantic
          - lexical
          - unknown
          description: 'Which ranker a scored read used: semantic (embedding index), lexical (keyword
            fallback), or unknown (the substrate''s health read did not answer).'
        embedding_healthy:
          type: boolean
          nullable: true
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
    Counts:
      type: object
      required:
      - decisions
      - options
      - escalations
      - unknowns
      - domains
      properties:
        decisions:
          type: integer
        options:
          type: integer
        escalations:
          type: integer
        unknowns:
          type: integer
        domains:
          type: integer
    ConfidenceSummary:
      type: object
      required:
      - min
      - mean
      - max
      properties:
        min:
          type: number
        mean:
          type: number
        max:
          type: number
    ThinDecision:
      type: object
      description: A decision below the confidence threshold or unmeasured — what the `ask` verb would
        drill next.
      required:
      - id
      - confidence
      - chosen
      properties:
        id:
          type: string
        confidence:
          type: number
          nullable: true
          description: null when the decision is unmeasured.
        chosen:
          type: string
    NamespaceStatus:
      type: object
      required:
      - namespace
      - project_id
      - name
      - status
      - counts
      properties:
        namespace:
          type: string
        project_id:
          type: string
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        counts:
          $ref: '#/components/schemas/Counts'
        confidence:
          $ref: '#/components/schemas/ConfidenceSummary'
        pending_memory_warnings:
          type: array
          items:
            type: string
          description: 'Decisions whose memory is provisional: stored but excluded from every aggregate
            until it lands.'
        thin_decisions:
          type: array
          items:
            $ref: '#/components/schemas/ThinDecision'
    CheckRequest:
      type: object
      required:
      - question
      properties:
        question:
          type: string
          minLength: 1
          description: The question under consideration.
        limit:
          type: integer
          minimum: 1
          default: 5
          description: How much stored evidence to retrieve.
    RecallHit:
      type: object
      required:
      - key
      - score
      - content
      properties:
        key:
          type: string
          description: The store key — for auger's own rows `/auger/<project>/<thing>`; anything else
            is another writer's row.
        score:
          type: number
          nullable: true
          description: Similarity rank on the labelled tier's scale.
        content:
          type: string
        timestamp:
          type: string
          nullable: true
    RecallResult:
      type: object
      required:
      - namespace
      - query
      - limit
      - project
      - tier
      - count
      - hits
      properties:
        namespace:
          type: string
        query:
          type: string
        limit:
          type: integer
        project:
          type: string
          nullable: true
        tier:
          type: string
          enum:
          - semantic
          - lexical
          - unknown
        count:
          type: integer
        hits:
          type: array
          items:
            $ref: '#/components/schemas/RecallHit'
    EmbeddingHit:
      type: object
      required:
      - key
      - kind
      - decision_id
      - score
      - domain
      - content
      - snippet
      - timestamp
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
          - seed
          - decision
          - memory
          description: 'Read from the key''s own shape: the project seed (`/auger/<project>/seed`), a
            decision''s evidence (`/auger/<project>/<decision-id>`), or another writer''s row (`memory`).'
        decision_id:
          type: string
          nullable: true
          description: Set exactly when kind is `decision`.
        score:
          type: number
          nullable: true
        domain:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        snippet:
          type: string
          nullable: true
        timestamp:
          type: string
          nullable: true
    EmbeddingSearchResult:
      type: object
      required:
      - namespace
      - query
      - limit
      - project
      - tier
      - embedding_healthy
      - count
      - results
      properties:
        namespace:
          type: string
        query:
          type: string
        limit:
          type: integer
        project:
          type: string
          nullable: true
        tier:
          type: string
          enum:
          - semantic
          - lexical
          - unknown
        embedding_healthy:
          type: boolean
          nullable: true
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingHit'
    CheckResult:
      type: object
      required:
      - namespace
      - question
      - tier
      - hits
      - verdict
      - verdict_decided_by
      - jev_used
      - jev_cost
      properties:
        namespace:
          type: string
        question:
          type: string
        tier:
          type: string
          enum:
          - semantic
          - lexical
          - unknown
        hits:
          type: array
          items:
            $ref: '#/components/schemas/RecallHit'
        verdict:
          type: string
          enum:
          - ALREADY ANSWERED
          - NOT YET ANSWERED
          - UNKNOWN
          description: 'UNKNOWN is the fail-closed answer: JEV was unreachable, and an unjudged check
            must never read as a judged one.'
        verdict_decided_by:
          type: string
          enum:
          - score
          - record
          - fail-closed
          description: 'Which decider produced the verdict: the JEV score, the stored question record
            (inside the score-drift band), or neither because JEV was unreachable.'
        jev_used:
          type: boolean
        jev_cost:
          type: string
          nullable: true
          description: The external call's reported cost, when JEV answered.
    VerdictRow:
      type: object
      required:
      - id
      - project_id
      - config_summary
      - verdict
      - judged_by
      - created_at
      properties:
        id:
          type: string
        project_id:
          type: string
        config_summary:
          type: string
        verdict:
          type: string
          enum:
          - good
          - bad
        reasons:
          type: string
        judged_by:
          type: string
        confidence:
          type: number
          nullable: true
        source:
          type: string
        note:
          type: string
        created_at:
          type: string
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: What was refused or failed, in one line.
