  /api/ns/{namespace}/embeddings/search:
    get:
      operationId: searchNamespaceEmbeddings
      summary: Embedding search with hit classification (the served route)
      description: 'The embedding search `auger serve` already publishes (AUG-046), addressed per namespace:
        ranked hits where each hit''s stored key is classified — `seed` (the project seed), `decision`
        (with the decision id it is evidence of), or `memory` (another writer''s row in a shared namespace,
        never guessed into an auger concept). Read-only for auger''s rows; queries the embedding/search
        provider through the DuckBrain substrate and can incur external cost. A store that cannot be asked
