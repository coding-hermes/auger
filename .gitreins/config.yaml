guards:
  secrets: true
  lint: true
  # NOTE: this key is NOT read by the installed gitreins (proven by marker
  # experiment 2026-09-20 — setting it to an echo produced no output and the arm
  # still passed). The lint arm that actually runs is gitreins' BUILT-IN one: it
  # selects staged python files itself and skips when the set is empty. This value
  # is kept as the closest true description for any version that does read it.
  lint_command: ruff check auger.py
  tests: true
  test_mode: full
  # tests/gate.sh is the repo's whole gate: py_compile + ruff + the end-to-end
  # smoke loop (15 assertions against a live throwaway DuckBrain namespace).
  # Naming the wrapper rather than smoke.sh alone keeps the arms together.
  test_command: bash tests/gate.sh
  test_timeout: 600
  # allow_skips: true — REQUIRED, and the reason is a real defect.
  # The built-in lint arm SKIPS whenever no python file is staged (a docs, board
  # or tests-only commit). With allow_skips:false that skip is DEGRADED PASS =
  # exit 1, so those commits were BLOCKED outright: documentation could not be
  # committed to this repo at all. A gate that fails correct work trains its users
  # to bypass it, and the bypass outlives the bug.
  #
  # This does NOT weaken real coverage. A FAILED arm is still fatal — only skips
  # are accepted — and the tests arm is `bash tests/gate.sh`, which always runs
  # (no skip path) and itself performs py_compile + ruff + the 15-assertion
  # end-to-end smoke loop. Lint coverage therefore still runs on every commit.
  allow_skips: true
  # static_analysis off: mypy/pyright are not provisioned for this repo, and an
  # arm that cannot run reports a green that verified nothing.
  static_analysis: false
evaluator:
  max_iterations: 200
  max_time: 30m
  max_input_tokens: 4M
  max_output_tokens: 131072
  tool_call_weight: 0.1
  fast_track: auto
  file_scope: full
  static_analysis_diagnostics: false
defaults:
  model: deepseek-flash
  api_key_env: GITREINS_LLM_API_KEY
  check_for_updates: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
