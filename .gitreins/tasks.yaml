tasks:
- id: GITREINS-JUDGE
  title: Configure the GitReins LLM judge (.gitreins/config.yaml)
  criteria:
  - '.gitreins/config.yaml exists with an evaluator block: max_iterations >= 100,
    max_time >= 10m, max_input_tokens >= 250k'
  - defaults.model names a served judge model and defaults.api_key_env is GITREINS_LLM_API_KEY
  - A Tier-2 verdict.json lands under .gitreins/history/<date>/<id>/ for a real task
    (prove it runs, not just that the file parses)
  - guards.test_command runs the repo's real test surface (tests/smoke.sh) and the
    pre-commit hook is installed
  status: complete
  created_at: '2026-09-20T23:35:02.251359+00:00'
  completed_at: '2026-09-21T00:29:04.270598+00:00'
- id: AUG-007
  title: "add the graph tables (edge, facet) and declare them in the namespace \u2014\
    \ SPEC-001 2/3"
  criteria:
  - auger init declares the edge and facet tables idempotently and the live namespace
    exposes them at /api/ns/<ns>/tables
  - an edge row round-trips through the declared-table API with its kind, confidence
    and source intact
  - inserting an edge whose src_id does not exist is REFUSED rather than silently
    stored (referential check)
  - facet rows are written one per facet for a question, and the facet set is data
    rather than hardcoded in the code path
  status: complete
  created_at: '2026-09-20T23:38:25.387720+00:00'
  completed_at: '2026-09-21T00:00:47.054680+00:00'
